<!doctype html>
<html lang="es" data-age="kid">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>No encontramos esta página — gacarbla.edu</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: 'Bricolage Grotesque';
        src: url('/fonts/bricolage-grotesque-latin.woff2') format('woff2');
        font-weight: 200 800;
        font-display: swap;
      }
      @font-face {
        font-family: 'Instrument Sans';
        src: url('/fonts/instrument-sans-latin.woff2') format('woff2');
        font-weight: 400 700;
        font-display: swap;
      }
      :root {
        --cream: #faf6ec;
        --paper: #fffdf7;
        --ink: #14201c;
        --ink-soft: #4a5a54;
        --green-700: #146b54;
        --green-800: #0f5542;
        --green-50: #e8f6ee;
        --line: #e4ddcb;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(45% 50% at 92% 4%, rgb(203 239 217 / 0.7), transparent 70%),
          radial-gradient(38% 46% at 4% 96%, rgb(253 240 200 / 0.7), transparent 72%),
          var(--cream);
        color: var(--ink);
        font-family: 'Instrument Sans', system-ui, sans-serif;
      }
      main {
        width: min(34rem, 100%);
        padding: clamp(1.6rem, 5vw, 2.6rem);
        border: 1px solid var(--line);
        border-radius: 1.6rem;
        background: var(--paper);
        box-shadow: 0 18px 50px rgb(20 32 28 / 0.08);
      }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 3rem;
        height: 3rem;
        border-radius: 0.9rem;
        background: var(--green-700);
        color: #fffdf7;
        font-family: 'Bricolage Grotesque', system-ui, sans-serif;
        font-size: 1.6rem;
        font-weight: 700;
      }
      p.eyebrow {
        margin: 1.1rem 0 0;
        color: var(--green-800);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0.4rem 0 0;
        font-family: 'Bricolage Grotesque', system-ui, sans-serif;
        font-size: clamp(2rem, 6vw, 2.9rem);
        line-height: 1.05;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0.9rem 0 0;
        color: var(--ink-soft);
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        margin-top: 1.5rem;
        padding: 0.8rem 1.2rem;
        border-radius: 999px;
        background: var(--green-700);
        color: #fffdf7;
        font-weight: 650;
        text-decoration: none;
      }
      a:hover { background: var(--green-800); }
      a:focus-visible {
        outline: 3px solid #f6c453;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">G</span>
      <p class="eyebrow">Error 404</p>
      <h1>Esta página no existe.</h1>
      <p>
        Puede que el enlace haya cambiado o que el aula ya no esté disponible. Las aulas son privadas: solo se entra
        con una invitación.
      </p>
      <a href="/">Volver a la portada <span aria-hidden="true">→</span></a>
    </main>
  </body>
</html>
