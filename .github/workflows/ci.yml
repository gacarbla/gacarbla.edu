name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Comprobar que no se publican documentos internos
        run: |
          if git ls-files | grep -Eq '^docs/(api|legal)/'; then
            echo "::error::Hay documentación privada de la API versionada. Quítala del índice antes de continuar."
            exit 1
          fi

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos y compilar
        run: npm run build
