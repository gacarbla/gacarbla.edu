name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Comprobar que no se publican documentos internos
        run: |
          if git ls-files | grep -Eq '^docs/(api|legal)/'; then
            echo "::error::Hay documentación privada de la API versionada. Quítala del índice antes de continuar."
            exit 1
          fi

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos y compilar
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
