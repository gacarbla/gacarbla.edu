<!doctype html>
<html lang="es" data-age="kid">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#faf6ec" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Entrar — gacarbla.edu</title>
    <meta name="description" content="Entra en tu cuenta de gacarbla o en tu aula con el alias que te dio tu docente." />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

    <script type="module" src="/src/login.ts"></script>
  </head>

  <body class="login-body">
    <div class="login-bg" aria-hidden="true">
      <span class="login-orb login-orb--a"></span>
      <span class="login-orb login-orb--b"></span>
      <span class="login-grid"></span>
    </div>

    <main class="login-stage">
      <section class="login-card" id="login-card" aria-labelledby="login-title">
        <div class="login-card__top">
          <div class="login-icon" id="login-icon" aria-hidden="true"></div>
          <a class="login-home" href="/">Volver a la portada</a>
        </div>

        <p class="login-eyebrow" id="login-eyebrow">gacarbla.edu</p>
        <h1 class="login-title" id="login-title" tabindex="-1">Entra en tu espacio.</h1>
        <p class="login-desc" id="login-desc">Un sitio tranquilo para tu grupo, tu temario y lo que estáis aprendiendo.</p>

        <div class="login-content" id="login-content"></div>
        <p class="login-foot" id="login-foot"></p>
      </section>

      <p class="login-legal">Aulas privadas por invitación · Sin cookies de seguimiento</p>
    </main>

    <noscript>Necesitas JavaScript para entrar en gacarbla.edu.</noscript>
  </body>
</html>
